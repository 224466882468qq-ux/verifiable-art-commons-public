name: Collaboration or mirror-node proposal
description: Offer research, review, translation or independent infrastructure
title: "[Collaboration] "
labels:
  - collaboration
body:
  - type: markdown
    attributes:
      value: |
        Public Issues must not contain public IP addresses, hostnames, cloud
        account IDs, exact locations, SSH endpoints, root access, server
        passwords, private keys, wallet files, database dumps, private logs,
        personal identity documents or production credentials.

        You keep control of your own server. The project does not request or
        accept server ownership, remote administration or credential handover.
  - type: dropdown
    id: contribution
    attributes:
      label: Contribution type
      options:
        - Independent mirror node
        - PostgreSQL failover research
        - Independent miner or chain validation
        - Security review
        - Copyright or provenance research
        - Translation and accessibility
        - Other technical contribution
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What can you verify, build or review?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Non-sensitive environment summary
      description: >-
        Use a coarse summary only, such as "Linux, 2 vCPU, read-only mirror".
        Do not include an IP, hostname, provider account, exact region or SSH
        address.
  - type: checkboxes
    id: safety
    attributes:
      label: Safety confirmation
      options:
        - label: I have not included private keys, passwords or personal data.
          required: true
        - label: I understand this is an early candidate, not an investment offer.
          required: true

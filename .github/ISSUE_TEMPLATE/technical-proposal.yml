name: Technical proposal
description: Propose a protocol, security, storage or tooling improvement
title: "[Proposal] "
labels:
  - proposal
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What failure, ambiguity or threat should be addressed?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed design
      description: Include trust assumptions, compatibility and failure cases.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence or references
      description: Papers, tests, counterexamples or reproducible observations.
  - type: checkboxes
    id: boundaries
    attributes:
      label: Boundaries
      options:
        - label: The proposal does not contain production secrets or private data.
          required: true
        - label: I understand consensus changes require additional review and signing.
          required: true
